name: poc-script-ado-source

trigger:
  branches:
    include:
      - main
      - development

variables:
  - group: poc-mirror-secrets

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - script: |
      echo "🔴 Pipeline reads from ADO Repo!"
      echo "Branch: $(Build.SourceBranchName)"
      echo "Commit: $(Build.SourceVersion)"
      echo "Files in repo:"
      find . -type f | sort
    displayName: 'Show ADO repo contents'

  - script: |
      echo "📞 Notifying GitHub to trigger mirror..."
      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
        -X POST \
        -H "Authorization: token $(GITHUB_PAT)" \
        -H "Accept: application/vnd.github.v3+json" \
        https://api.github.com/repos/katerinampatsougianni/SyncGitHubToADO-poc-mirror-script/dispatches \
        -d "{\"event_type\":\"ado-commit\",\"client_payload\":{\"branch\":\"$(Build.SourceBranchName)\"}}")
      
      echo "GitHub API Response: $RESPONSE"
      
      if [ "$RESPONSE" = "204" ]; then
        echo "✅ GitHub notified successfully!"
      else
        echo "❌ Failed to notify GitHub! Response: $RESPONSE"
        exit 1
      fi
    displayName: 'Trigger GitHub Mirror via API'
