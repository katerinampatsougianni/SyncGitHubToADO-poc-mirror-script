name: Mirror to Azure DevOps

on:
  push:
    branches:
      - '**'
  delete:
  workflow_dispatch:

jobs:
  mirror-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branch to Azure DevOps
        env:
          ADO_PAT: ${{ secrets.POC_MIRROR_SCRIPT_PAT }}
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "Mirroring branch: $BRANCH"
          git remote add ado "https://anything:${ADO_PAT}@dev.azure.com/ACN-CCoE/Enerwave%20-%20Digital%20Services/_git/SyncGitHubToADO-poc-mirror-script.git"
          git push ado HEAD:refs/heads/$BRANCH --force
          echo "✅ Mirrored branch '$BRANCH' to Azure DevOps"

  mirror-delete:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete branch from Azure DevOps
        env:
          ADO_PAT: ${{ secrets.POC_MIRROR_SCRIPT_PAT }}
        run: |
          BRANCH="${{ github.event.ref }}"
          echo "Deleting branch '$BRANCH' from Azure DevOps"
          git remote add ado "https://anything:${ADO_PAT}@dev.azure.com/ACN-CCoE/Enerwave%20-%20Digital%20Services/_git/SyncGitHubToADO-poc-mirror-script.git"
          git push ado --delete "refs/heads/${BRANCH}"
          echo "✅ Deleted branch '$BRANCH' from Azure DevOps"
