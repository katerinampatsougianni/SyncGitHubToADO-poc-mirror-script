name: build-and-publish
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t my-app:${{ github.sha }} -f docker/Dockerfile .

      - name: Save image to tarball
        run: |
          mkdir -p upload
          docker save my-app:${{ github.sha }} | gzip > upload/image.tar.gz

      - name: Publish to Azure Artifacts
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.ADO_PUBLISH_ARTIFACT }}
        run: |
          az extension add --name azure-devops
          az artifacts universal publish \
            --organization https://dev.azure.com/ACN-CCoE \
            --project Enerwave%20-%20Digital%20Services \
            --scope project \
            --feed images \
            --name my-app-katerina \
            --version 1.0.${{ github.run_number }} \
            --description "sha ${{ github.sha }}" \
            --path upload

      - name: Trigger ADO release pipeline
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -u ":${{ secrets.ADO_PUBLISH_ARTIFACT }}" \
            -H "Content-Type: application/json" \
            -d '{"resources":{"repositories":{"self":{"refName":"refs/heads/main"}}},
                 "templateParameters":{"version":"1.0.${{ github.run_number }}"}}' \
            "https://dev.azure.com/ACN-CCoE/Enerwave%20-%20Digital%20Services/_apis/pipelines/106/runs?api-version=7.1")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Failed to trigger ADO pipeline! Status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ ADO pipeline triggered successfully!"
