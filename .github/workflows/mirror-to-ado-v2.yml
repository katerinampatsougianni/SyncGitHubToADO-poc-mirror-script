name: Mirror to Azure DevOps

on:
  push:
    branches:
      - main
      - development
  repository_dispatch:
    types: [ado-commit]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.branch || github.ref }}

      - name: Push mirror to Azure DevOps
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "$GITHUB_REF" ]; then
            BRANCH=${{ github.event.client_payload.branch || 'main' }}
          fi
          
          echo "🔄 Mirroring branch: $BRANCH"
          git remote add ado https://anything:${{ secrets.POC_MIRROR_SCRIPT_PAT }}@dev.azure.com/ACN-CCoE/Enerwave%20-%20Digital%20Services/_git/SyncGitHubToADO-poc-mirror-script.git
          git push ado HEAD:$BRANCH --force

      - name: Confirm mirror success
        run: echo "✅ Mirrored branch to Azure DevOps!"
